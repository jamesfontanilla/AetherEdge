# Backblaze B2 Object Storage Configuration
# Cloudflare Bandwidth Alliance Peering Rules ($0.00 Egress Guarantee)

# S3 Compatibility API Endpoint:
# https://s3.<region>.backblazeb2.com

# 1. Bucket Naming Convention:
# aether-storage-production

# 2. Bandwidth Alliance Origin Request Headers:
# The edge gateway worker proxies all requests to /_static/* using Cloudflare Anycast peering.
# B2 recognizes Cloudflare IPs and waives all internet egress bandwidth fees ($0.00 / GB).

BUCKET_NAME="aether-storage-prod"
CORS_ORIGIN="*.aether.run"
ALLOWED_OPERATIONS="s3:GetObject,s3:PutObject,s3:DeleteObject"
