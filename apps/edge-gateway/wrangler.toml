name = "aetheredge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "aetheredge.jamesfontanilla.com/*", zone_name = "jamesfontanilla.com" }
]
workers_dev = true

[vars]
ENVIRONMENT = "production"
DEFAULT_UPSTREAM = "https://aetheredge.jamesfontanilla.com"
B2_BANDWIDTH_ALLIANCE_ENDPOINT = "https://f000.backblazeb2.com"

# Pillar 2: D1 Relational SQL Database Binding
[[d1_databases]]
binding = "AETHER_DB"
database_name = "aether-primary-d1"
database_id = "ecf7c1b0-dfbe-44ff-9b58-56082d14e229"

# Pillar 6: In-Memory KV Cache Binding
[[kv_namespaces]]
binding = "AETHER_KV"
id = "3368da4f199e4333a8bf181948823840"

# Edge AI Gateway Proxy
[ai]
binding = "AI"
